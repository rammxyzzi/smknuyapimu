<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Siswa — SMK NU Ghofarona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,600;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="layar-tengah">
  <div class="kartu-auth">
    <div class="brand">
      <div class="brand-mark">NG</div>
    </div>
    <h1>Masuk Akun Siswa</h1>
    <p class="sub">Login dulu sebelum melakukan presensi.</p>

    <div class="pesan" id="pesan"></div>

    <form id="formLogin">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="nama@smknughofarona.sch.id">
      </div>
      <div class="field">
        <label for="password">Kata sandi</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-hijau btn-blok" id="btnLogin">Masuk</button>
    </form>

    <p class="tautan-bawah">
      Belum punya akun? Hubungi admin/wali kelas untuk didaftarkan.<br>
      <a href="index.html">← Kembali ke beranda</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
